<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老年连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #f9f9f9;
            text-align: center;
            padding: 20px;
        }
        .title {
            font-size: 50px;
            font-weight: bold;
            color: #000;
            margin-bottom: 20px;
        }
        .level-text {
            font-size: 36px;
            color: #d32f2f;
            font-weight: bold;
            margin-bottom: 30px;
        }
        #canvas {
            border: 10px solid #333;
            background: white;
            border-radius: 10px;
        }
        .reset-btn {
            font-size: 32px;
            padding: 20px 40px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 15px;
            margin-top: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="title">🧡 老年休闲连连看 🧡</div>
    <div class="level-text" id="level-info">当前段位：新手</div>

    <canvas id="canvas" width="900" height="700"></canvas>
    <br>
    <button class="reset-btn" onclick="restartGame()">重新开始这一局</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const LEVEL_NAMES = ["新手", "入门", "熟练", "大师", "宗师"];
let currentLevel = 0;

let tiles = [];
let first = null;
let isBusy = false;

const ICONS = ["🍎", "🍐", "🍊", "🍋", "🍌", "🍉", "🍇", "🍓", "🍒", "🍑", "🥭", "🥥"];

function startLevel(level) {
    currentLevel = level;
    document.getElementById("level-info").innerText = `当前段位：${LEVEL_NAMES[level]}`;

    let size = 4 + level;
    if (size > 8) size = 8;
    createGame(size);
}

function createGame(gridSize) {
    tiles = [];
    first = null;
    isBusy = false;

    let total = gridSize * gridSize;
    let pairCount = total / 2;
    let selected = ICONS.slice(0, pairCount);
    let arr = [...selected, ...selected];
    arr.sort(() => Math.random() - 0.5);

    let tileSize = 90;
    let startX = (canvas.width - gridSize * tileSize) / 2;
    let startY = 100;

    for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
            let index = row * gridSize + col;
            tiles.push({
                x: startX + col * tileSize,
                y: startY + row * tileSize,
                w: tileSize - 8,
                h: tileSize - 8,
                icon: arr[index],
                matched: false,
                visible: true
            });
        }
    }
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tiles.forEach(t => {
        if (!t.visible) return;
        ctx.fillStyle = t.matched ? "#a5d6ff" : "#ffffff";
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 4;
        ctx.strokeRect(t.x, t.y, t.w, t.h);

        ctx.font = "50px 微软雅黑";
        ctx.fillStyle = "#d32f2f";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.icon, t.x + t.w/2, t.y + t.h/2);
    });
}

canvas.onclick = function(e) {
    if (isBusy) return;
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    let clickTile = tiles.find(t => 
        t.visible && !t.matched &&
        x > t.x && x < t.x + t.w &&
        y > t.y && y < t.y + t.h
    );
    if (!clickTile) return;

    if (!first) {
        first = clickTile;
        ctx.strokeStyle = "#388e3c";
        ctx.lineWidth = 6;
        ctx.strokeRect(first.x, first.y, first.w, first.h);
        return;
    }

    if (first === clickTile) return;

    isBusy = true;
    if (first.icon === clickTile.icon) {
        first.matched = true;
        clickTile.matched = true;
        first.visible = false;
        clickTile.visible = false;
    }

    setTimeout(() => {
        first = null;
        isBusy = false;
        draw();
        checkWin();
    }, 300);
};

function checkWin() {
    let allDone = tiles.every(t => t.matched);
    if (!allDone) return;

    setTimeout(() => {
        if (currentLevel < LEVEL_NAMES.length - 1) {
            alert(`✅ 恭喜过关！升级到：${LEVEL_NAMES[currentLevel + 1]}`);
            startLevel(currentLevel + 1);
        } else {
            alert("🏆 恭喜你！已经达到最高段位：宗师！");
        }
    }, 500);
}

function restartGame() {
    startLevel(currentLevel);
}

window.onload = () => startLevel(0);
</script>
</body>
</html>
