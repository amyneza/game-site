<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老年休闲连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #f9f9f9;
            text-align: center;
            padding: 15px;
        }
        .title {
            font-size: 46px;
            font-weight: bold;
            color: #000;
            margin-bottom: 12px;
        }
        .level-text {
            font-size: 34px;
            color: #d32f2f;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #canvas {
            border: 8px solid #333;
            background: white;
            border-radius: 8px;
            display: inline-block;
        }
        .reset-btn {
            font-size: 30px;
            padding: 14px 28px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="title">🧡 老年休闲连连看 🧡</div>
    <div class="level-text" id="level-info">当前段位：新手</div>

    <canvas id="canvas" width="800" height="720"></canvas>
    <br>
    <button class="reset-btn" onclick="restartGame()">重新开始这一局</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const LEVEL_NAMES = ["新手", "入门", "熟练", "大师", "宗师"];
const GRID_SIZES = [4, 5, 6, 7, 8];
const EMOJIS = ["🍎", "🍐", "🍊", "🍋", "🍌", "🍉", "🍇", "🍓", "🍒", "🍑", "🥭", "🥥", "🍍", "🍈", "🍇", "🍏"];

let currentLevel = 0;
let gridSize;
let tileSize;
let offsetX, offsetY;
let tiles = [];
let firstSelected = null;
let isProcessing = false;

// 开始游戏
function startGame(level) {
    currentLevel = level;
    gridSize = GRID_SIZES[level];
    tileSize = Math.min(720, 700) / gridSize;
    offsetX = (canvas.width - gridSize * tileSize) / 2;
    offsetY = 20;
    document.getElementById("level-info").innerText = `当前段位：${LEVEL_NAMES[level]}`;
    createBoard();
}

// 创建棋盘
function createBoard() {
    tiles = [];
    firstSelected = null;
    isProcessing = false;

    const total = gridSize * gridSize;
    const pairs = Math.floor(total / 2);
    let icons = EMOJIS.slice(0, pairs);
    let board = [...icons, ...icons];
    board.sort(() => Math.random() - 0.5);

    for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
            const index = row * gridSize + col;
            tiles.push({
                row, col,
                x: offsetX + col * tileSize,
                y: offsetY + row * tileSize,
                w: tileSize - 6,
                h: tileSize - 6,
                icon: board[index],
                visible: true,
                matched: false
            });
        }
    }
    drawAll();
}

// 绘制全部
function drawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tiles.forEach(t => {
        if (!t.visible) return;
        ctx.fillStyle = t.matched ? "#a1dfff" : "#fff";
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        ctx.strokeRect(t.x, t.y, t.w, t.h);

        ctx.font = "38px 微软雅黑";
        ctx.fillStyle = "#d32f2f";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.icon, t.x + t.w / 2, t.y + t.h / 2);
    });
}

// 绘制连线
function drawConnectLine(a, b) {
    ctx.strokeStyle = "#00c853";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(a.x + a.w / 2, a.y + a.h / 2);
    ctx.lineTo(b.x + b.w / 2, b.y + b.h / 2);
    ctx.stroke();
}

// 连连看核心规则：0、1、2个弯，不穿过图标
function canConnect(a, b) {
    if (a === b || a.icon !== b.icon || !a.visible || !b.visible) return false;
    const r1 = a.row, c1 = a.col;
    const r2 = b.row, c2 = b.col;

    function isEmpty(r, c) {
        if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return true;
        const t = tiles[r * gridSize + c];
        return !t.visible || t.matched;
    }

    // 0弯
    if (r1 === r2) {
        let min = Math.min(c1, c2), max = Math.max(c1, c2);
        for (let c = min + 1; c < max; c++) if (!isEmpty(r1, c)) return false;
        return true;
    }
    if (c1 === c2) {
        let min = Math.min(r1, r2), max = Math.max(r1, r2);
        for (let r = min + 1; r < max; r++) if (!isEmpty(r, c1)) return false;
        return true;
    }

    // 1弯
    if (isEmpty(r1, c2) && isEmpty(r2, c1)) {
        return true;
    }

    // 2弯
    for (let r = 0; r < gridSize; r++) {
        if (isEmpty(r, c1) && isEmpty(r, c2)) {
            let ok = true;
            for (let cr = Math.min(r1, r) + 1; cr < Math.max(r1, r); cr++) if (!isEmpty(cr, c1)) ok = false;
            for (let cr = Math.min(r, r2) + 1; cr < Math.max(r, r2); cr++) if (!isEmpty(cr, c2)) ok = false;
            for (let cc = Math.min(c1, c2) + 1; cc < Math.max(c1, c2); cc++) if (!isEmpty(r, cc)) ok = false;
            if (ok) return true;
        }
    }
    for (let c = 0; c < gridSize; c++) {
        if (isEmpty(r1, c) && isEmpty(r2, c)) {
            let ok = true;
            for (let cc = Math.min(c1, c) + 1; cc < Math.max(c1, c); cc++) if (!isEmpty(r1, cc)) ok = false;
            for (let cc = Math.min(c, c2) + 1; cc < Math.max(c, c2); cc++) if (!isEmpty(r2, cc)) ok = false;
            for (let cr = Math.min(r1, r2) + 1; cr < Math.max(r1, r2); cr++) if (!isEmpty(cr, c)) ok = false;
            if (ok) return true;
        }
    }
    return false;
}

// 点击事件
canvas.onclick = (e) => {
    if (isProcessing) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const clicked = tiles.find(t =>
        t.visible && mx > t.x && mx < t.x + t.w && my > t.y && my < t.y + t.h
    );
    if (!clicked) return;

    if (!firstSelected) {
        firstSelected = clicked;
        ctx.strokeStyle = "#ff9800";
        ctx.lineWidth = 5;
        ctx.strokeRect(clicked.x, clicked.y, clicked.w, clicked.h);
        return;
    }

    if (firstSelected === clicked) return;
    if (!canConnect(firstSelected, clicked)) {
        drawAll();
        firstSelected = null;
        return;
    }

    isProcessing = true;
    drawConnectLine(firstSelected, clicked);

    setTimeout(() => {
        firstSelected.matched = true;
        clicked.matched = true;
        firstSelected.visible = false;
        clicked.visible = false;
        firstSelected = null;
        isProcessing = false;
        drawAll();
        checkWin();
    }, 450);
};

// 检查通关
function checkWin() {
    const allClear = tiles.every(t => !t.visible || t.matched);
    if (!allClear) return;

    setTimeout(() => {
        if (currentLevel < LEVEL_NAMES.length - 1) {
            alert(`✅ 恭喜通关！\n进入：${LEVEL_NAMES[currentLevel + 1]}`);
            startGame(currentLevel + 1);
        } else {
            alert("🏆 恭喜！你已成为最高段位：宗师！");
        }
    }, 600);
}

// 重新开始
function restartGame() {
    startGame(currentLevel);
}

window.onload = () => startGame(0);
</script>
</body>
</html>
